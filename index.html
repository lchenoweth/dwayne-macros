<style>
:root{
  --pink:#2E5A9C; --pink2:#8FB3E8; --ink:#14171C;
  --bg:#ECEEF1; --card:#FFFFFF; --text:#14171C; --muted:#5E6773; --line:#D9DEE5; --chip:#E3E7EC;
  --good:#22A866; --over:#D93A4E; --block:#14171C; --blockText:#FFFFFF; --blockMuted:#A3ABB8; --blockLine:#2B3039;
  --shadow:0 1px 0 rgba(20,23,28,.04),0 8px 24px rgba(20,23,28,.07);
  --head:'Oswald','Arial Narrow',-apple-system,system-ui,sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0E1013; --card:#1A1E24; --text:#E9EDF2; --muted:#98A1AE; --line:#262B33; --chip:#232831;
  --block:#14171C; --blockLine:#2B3039; --shadow:0 0 0 1px #232831;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:var(--body);color:var(--text);font-size:16px;line-height:1.4;touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--head);font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin:0}
h1{font-size:26px;font-weight:900}
h2{font-size:17px}
h3{font-size:13px;color:var(--muted);letter-spacing:.08em}
button{font-family:inherit;font-size:16px;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
.screen{display:none;max-width:640px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(100px + env(safe-area-inset-bottom)) calc(env(safe-area-inset-left) + 14px)}
.screen.active{display:block}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.block{background:var(--block);color:var(--blockText);border:1px solid var(--blockLine)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h .sub{font-size:13px;color:var(--muted);font-weight:600}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0}
.tag{display:inline-block;font:800 11px var(--head);text-transform:uppercase;letter-spacing:.08em;padding:5px 9px;border-radius:999px;background:var(--pink);color:#fff}
.tag.ghost{background:var(--chip);color:var(--muted)}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--chip);color:var(--text);font:800 14px var(--head);text-transform:uppercase;letter-spacing:.05em;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--pink);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.outline{background:transparent;border:2px solid var(--pink);color:var(--pink)}
.btn.danger{background:transparent;color:var(--over);border:2px solid var(--over)}
.btn.sm{min-height:40px;padding:0 14px;font-size:12px;border-radius:12px}
.btn.wide{width:100%}
.btn:active,.mixbtn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}

.topbar{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.challenge{font:800 12px var(--head);text-transform:uppercase;letter-spacing:.1em;color:var(--pink)}
.daynav{display:flex;align-items:center;gap:8px}
.navbtn{width:48px;height:48px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
.daylabel{flex:1;text-align:center}
.daylabel .dl-main{font:900 22px var(--head);text-transform:uppercase;letter-spacing:.02em}
.daylabel .dl-sub{font-size:13px;color:var(--muted);font-weight:600}
.todaylink{align-self:center}

.budget .calrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.bignum{font:900 44px/1 var(--head);letter-spacing:-.01em}
.biglbl{font:800 11px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--pink2);margin-top:6px}
.calmeta{text-align:right;font-size:13px;color:var(--blockMuted)}
.calmeta b{color:#fff}
.mac{margin-top:12px}
.mac-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px}
.mac-name{font:800 12px var(--head);text-transform:uppercase;letter-spacing:.08em}
.mac-val{color:var(--blockMuted)}
.mac-val b{color:#fff}
.bar{position:relative;height:12px;border-radius:8px;background:#2B3039;overflow:hidden}
.bar .band{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.12)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--pink)}
.bar .fill.on{background:var(--good)}
.bar .fill.over{background:var(--over)}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.8}
.st{font:700 12px var(--body);padding:3px 8px;border-radius:999px;white-space:nowrap}
.st.on{background:rgba(34,168,102,.18);color:#3DDC8A}
.st.left{background:rgba(143,179,232,.16);color:var(--pink2)}
.st.over{background:rgba(217,58,78,.2);color:#FF7385}
.card:not(.block) .st.on{color:var(--good)}
.card:not(.block) .st.left{color:var(--pink)}
.card:not(.block) .st.over{color:var(--over)}
.eatenline{margin-top:14px;padding-top:12px;border-top:1px solid var(--blockLine);font-size:13px;color:var(--blockMuted)}

.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0}
.item-top{display:flex;align-items:center;gap:10px}
.check{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:transparent;color:transparent;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.item-name{flex:1;min-width:0;font-weight:600}
.item-name .sv{display:block;font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.eaten .item-name{opacity:.6}
.xmini{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:22px}
.item-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-left:44px}
.macline{font-size:13px;color:var(--muted)}
.macline b{color:var(--text);font-weight:700}
.stepper{display:flex;align-items:center;background:var(--chip);border-radius:14px;flex:none}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:22px;font-weight:700;color:var(--pink)}
.stepper span{min-width:44px;text-align:center;font-weight:800;font-size:15px}
.empty{font-size:14px;color:var(--muted);padding:6px 0 2px}
.row-btns{display:flex;align-items:center;gap:6px}
.emptyrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.linkbtn{min-height:40px;padding:0 4px;border:0;background:transparent;color:var(--pink);font:700 14px var(--body)}
.addslot{display:block;margin-top:8px}
.skipbox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--muted)}
.addbtn{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--pink);background:transparent;color:var(--pink);font:800 12px var(--head);text-transform:uppercase;letter-spacing:.06em}

.dinner{border:2px solid var(--pink)}
.dinner-main{background:var(--chip);border-radius:16px;padding:12px;margin-bottom:12px}
.servrow{display:flex;align-items:center;gap:12px;margin-top:10px;padding-left:44px}
.ofserv{font-size:14px;color:var(--muted);font-weight:600}
.suggest{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:12px;border-radius:16px;background:var(--ink);color:#fff}
[data-theme="dark"] .suggest{border:1px solid var(--blockLine)}
.suggest .s-txt{flex:1;font-size:14px;line-height:1.35}
.suggest .s-txt b{font:900 16px var(--head);color:var(--pink2)}
.suggest .s-sub{font-size:12px;color:var(--blockMuted);margin-top:2px}
.subhead{font:800 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;display:flex;align-items:center;justify-content:space-between}
.breakdown{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.breakdown td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.breakdown td:first-child{text-align:left;font-weight:600}
.breakdown tr.total td{font-weight:800;border-top:2px solid var(--text)}
.breakdown th{font:800 10px var(--head);letter-spacing:.08em;color:var(--muted);text-align:right;padding:0 4px 4px}
.breakdown th:first-child{text-align:left}

.ideas .aim{background:var(--chip);border-radius:14px;padding:12px;font-size:15px;margin:10px 0}
.ideas .aim b{font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:700 13px var(--body);color:var(--text);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ================= DINNER SUGGESTION ================= */
function dinnerSuggestion(d){
  if(!d.dinner || d.dinner.cal <= 0) return null;
  var T = S.settings.targets;
  var others = dayTotals(d, {noDinner:true});
  var base = subM(T, others);
  var open = openMeals(d);
  var closing = open.length === 0;
  var share = Math.min(90, Math.max(10, +S.settings.dinnerShare || 40)) / 100;
  var wd = share/(1-share)*100;
  var wOpen = open.reduce(function(s,m){ return s+wt(m); }, 0);
  var frac = closing ? 1 : wd/(wd+wOpen);
  var sides = sumEntries(d.sides);
  var goalMain = subM(scaleM(base, frac), sides);
  var exact = goalMain.cal / d.dinner.cal;
  if(exact < 0.125) return {q:null, closing:closing, full:true};
  var q = Math.max(0.25, Math.min(12, Math.round(exact*4)/4));
  var main = scaleM(d.dinner, q);
  var dayAfter = addM(addM(others, sides), main);
  var dinnerAfter = addM(main, sides);
  var hitDay = MAC.every(function(m){ return status(m, dayAfter[m]).k==='on'; });
  return {q:q, closing:closing, main:main, dinnerAfter:dinnerAfter, dayAfter:dayAfter, hitDay:hitDay, share:Math.round(frac*100)};
}

function comboData(){
  var sig = libSig();

  var pool = S.library.filter(function(i){ return i.cat!=='Dinners' && i.cal>0 && i.id!=='coffee'; });
  var n = pool.length;
  var WHOLE = ['Chick-fil-A','Chipotle',"Jimmy John's",'QuikTrip'];
  function qs(it, pair){ return WHOLE.indexOf(it.cat) >= 0 ? (pair ? [1] : [1,2]) : (pair ? PAIR_QTYS : QTYS); }
  var total = 0;
  for(var t1=0;t1<n;t1++){ total += qs(pool[t1],false).length; for(var t2=t1+1;t2<n;t2++) total += qs(pool[t1],true).length*qs(pool[t2],true).length; }

  var k = 0;
  for(var i=0;i<n;i++){ var it = pool[i], L = qs(it,false);
    for(var x=0;x<L.length;x++){ var q = L[x];
      A[k]=i; B[k]=-1; QA[k]=q; QB[k]=0; CAL[k]=it.cal*q; P[k]=it.p*q; C[k]=it.c*q; F[k]=it.f*q; k++; } }

function lowerBound(arr, v){ var lo=0, hi=arr.length; while(lo<hi){ var m=(lo+hi)>>1; if(arr[m]<v) lo=m+1; else hi=m; } return lo; }

/* ================= WHOLE-DAY PLAN ================= */
function planSig(d){
  var t = dayTotals(d);
  return [t.cal,t.p,t.c,t.f].join(',')+'|'+openMeals(d).join(',')+'|'+
    S.library.map(function(i){ return i.id+':'+i.cat+':'+i.cal+':'+i.p+':'+i.c+':'+i.f; }).join(';')+'|'+
    JSON.stringify(S.settings.targets)+JSON.stringify(S.settings.tol);
}

}

function genPlan(d, avoid){
  var open = openMeals(d), base = subM(S.settings.targets, dayTotals(d)), results = [];
  for(var t=0; t<12; t++){
    var picks = {}, used = {}, rem = base, sum = zero(), empty = 0, fitPen = 0;
    for(var i=0; i<open.length; i++){

      var c = buildIdeas(m, tgt, rem);
      var fresh = c.filter(function(o){ return !o.parts.some(function(p){ return used[p.it.id]; }); });
      if(fresh.length) c = fresh;
      if(!c.length){ empty++; continue; }
      var n = Math.min(c.length, 6), idx = t===0 ? 0 : Math.floor(Math.pow(Math.random(), 1.6)*n);
      var o = c[idx];

      sum = addM(sum, o.sum); rem = subM(rem, o.sum); fitPen += o.score*0.25;

function mixMeal(d, meal){

    if(m===meal) return;
    var parts = partsFromPick(p.picks[m]);
    if(parts){ others = addM(others, partsSum(parts)); parts.forEach(function(x){ used[x.it.id] = 1; }); }
  });

  var unpicked = open.filter(function(m){ return m===meal || !p.picks[m]; });
  var tgt = clampM(scaleM(rem, wt(meal)/sumW(unpicked)));
  var c = buildIdeas(meal, tgt, rem);
  var fresh = c.filter(function(o){ return !o.parts.some(function(x){ return used[x.it.id]; }); });
  if(fresh.length) c = fresh;
  var curParts = partsFromPick(p.picks[meal]), cur = curParts ? ideaKey(curParts) : '';

  var next = c.filter(function(o){ return seen.indexOf(ideaKey(o.parts)) < 0; })[0];
  if(!next){ seen = cur ? [cur] : []; next = c.filter(function(o){ return ideaKey(o.parts) !== cur; })[0]; }
  if(!next){ toast('No other options for '+mealLabel(meal)+'. Add more foods to your library.'); return false; }

      '<div class="fast-edit"><label>Started at <input id="fastStartTime" type="time" value="'+pad(new Date(F.start).getHours())+':'+pad(new Date(F.start).getMinutes())+'"></label>'+
      '<button class="btn sm" data-act="fastToggle">End fast</button></div>';
  }
  return h + '</section>';
}
function tickFast(){
  if(!S.fast.on) return;
  var el = document.getElementById('fastLive'); if(el) el.innerHTML = fastLiveHTML();
  var dur = S.fast.hours*3600000;
  if(Date.now() - S.fast.start >= dur && !S.fast.notified){ S.fast.notified = true; save(); toast('Fast complete ✓ '+S.fast.hours+' hours'); }
}
setInterval(tickFast, 30000);

function statusBadge(st, unit){
  if(st.k==='on') return '<span class="st on">✓ on target</span>';
  if(st.k==='left') return '<span class="st left">'+fG(Math.round(st.diff))+unit+' left</span>';
  return '<span class="st over">'+fG(Math.round(st.diff))+unit+' over</span>';
}

function budgetHTML(d){
  var T = S.settings.targets, tol = S.settings.tol, t = dayTotals(d), e = eatenTotals(d);
  var calLeft = r1(T.cal - t.cal), cs = status('cal', t.cal);
  var h = '<section class="card block budget">';
  h += '<div class="calrow"><div><div class="bignum">'+fInt(Math.abs(calLeft))+'</div><div class="biglbl">'+(calLeft<0?'Calories over':'Calories left')+'</div></div>';
  h += '<div class="calmeta">Planned <b>'+fInt(t.cal)+'</b> / '+fInt(T.cal)+'<div style="margin-top:6px">'+statusBadge(cs,' cal')+'</div></div></div>';
  [['p','Protein'],['c','Carbs'],['f','Fat']].forEach(function(x){
    var m = x[0], tg = T[m] || 1, scale = tg*1.15, st = status(m, t[m]);
    var pct = Math.min(100, t[m]/scale*100);
    var lo = Math.max(0,(tg-tol[m])/scale*100), hi = Math.min(100,(tg+tol[m])/scale*100);
    h += '<div class="mac"><div class="mac-top"><span class="mac-name">'+x[1]+'</span><span class="mac-val"><b>'+fG(Math.round(t[m]))+'</b> / '+fG(tg)+'g &nbsp;'+statusBadge(st,'g')+'</span></div>';
    h += '<div class="bar"><div class="band" style="left:'+lo+'%;width:'+(hi-lo)+'%"></div><div class="fill '+st.k+'" style="width:'+pct+'%"></div><div class="tick" style="left:calc('+(tg/scale*100)+'% - 1px)"></div></div></div>';
  });
  h += '<div class="eatenline">Eaten so far: '+macLine(e)+'</div></section>';
  return h;
}

function entryHTML(e, where){
  var m = em(e);
  return '<div class="item'+(e.eaten?' eaten':'')+'">'+
    '<div class="item-top"><button class="check'+(e.eaten?' on':'')+'" data-act="eat" data-where="'+where+'" data-uid="'+e.uid+'" aria-label="Mark eaten">✓</button>'+
    '<div class="item-name">'+esc(e.name)+(e.serving?'<span class="sv">'+esc(e.serving)+'</span>':'')+'</div>'+
    '<button class="xmini" data-act="remove" data-where="'+where+'" data-uid="'+e.uid+'" aria-label="Remove">&times;</button></div>'+
    '<div class="item-bot"><div class="macline">'+macLine(m,true)+'</div>'+
    '<div class="stepper"><button data-act="dec" data-where="'+where+'" data-uid="'+e.uid+'" aria-label="Less">−</button><span>'+fQ(e.qty)+'</span><button data-act="inc" data-where="'+where+'" data-uid="'+e.uid+'" aria-label="More">+</button></div></div></div>';
}

function dinnerHTML(d){
  var h = '<section class="card dinner"><div class="card-h"><h2>Dinner</h2><span class="tag">Lauryn’s cooking</span></div>';
  if(!d.dinner){
    if(holdOn(d)){
      var H = S.settings.hold;
      h += '<div class="suggest"><div class="s-txt"><b>Waiting on Lauryn</b><div class="s-sub">Holding '+macLine(H)+' for dinner. The rest of your day plans around it.</div></div></div>';
    } else if(d.noHold){
      h += '<div class="suggest"><div class="s-txt"><b>No dinner hold today</b><div class="s-sub">Eating out or skipping? Add it as a meal or side when you know.</div></div><button class="btn sm" data-act="holdToggle">Hold again</button></div>';
    }
    h += '<button class="btn primary wide" data-act="pick" data-where="dinner">+ Pick tonight’s recipe</button>';
    if(holdOn(d)) h += '<button class="linkbtn" data-act="holdToggle" style="margin-top:6px">Not eating at home tonight</button>';
    if(d.sides.length){ h += '<div class="subhead">Sides</div>'; d.sides.forEach(function(e){ h += entryHTML(e,'sides'); }); }
    return h + '</section>';
  }
  var e = d.dinner, main = em(e);
  h += '<div class="dinner-main"><div class="item-top"><button class="check'+(e.eaten?' on':'')+'" data-act="eat" data-where="dinner" data-uid="'+e.uid+'" aria-label="Mark eaten">✓</button>'+
    '<div class="item-name">'+esc(e.name)+(e.serving?'<span class="sv">'+esc(e.serving)+'</span>':'')+'</div>'+
    '<button class="btn sm" data-act="pick" data-where="dinner">Change</button>'+
    '<button class="xmini" data-act="remove" data-where="dinner" data-uid="'+e.uid+'" aria-label="Remove">&times;</button></div>'+
    '<div class="servrow"><div class="stepper"><button data-act="dec" data-where="dinner" data-uid="'+e.uid+'">−</button><span>'+fQ(e.qty)+'</span><button data-act="inc" data-where="dinner" data-uid="'+e.uid+'">+</button></div>'+
    '<div class="ofserv">'+(e.servings ? 'of '+fG(e.servings)+' servings' : 'servings')+'</div></div></div>';

  var sg = dinnerSuggestion(d);
  if(sg){
    if(sg.full){
      h += '<div class="suggest"><div class="s-txt">Your day is already full before dinner. Trim something or use a small portion.</div></div>';
    } else {
      var sub = sg.closing
        ? (sg.hitDay ? 'Rounds out your day, everything lands on target ✓' : 'Closest quarter serving to round out your day')
        : 'Dinner’s share: '+sg.share+'% of what’s left. The rest of your day is still open.';
      var same = r2(sg.q) === r2(e.qty);
      h += '<div class="suggest"><div class="s-txt">Suggested: <b>'+fQ(sg.q)+' serving'+(sg.q===1?'':'s')+'</b>'+
        '<div class="s-sub">'+sub+'</div><div class="s-sub">Dinner would be '+macLine(sg.dinnerAfter)+'</div></div>'+
        (same ? '<span class="st on">✓ Using</span>' : '<button class="btn primary sm" data-act="useSuggest" data-q="'+sg.q+'">Use '+fQ(sg.q)+'</button>')+'</div>';
    }
  }

  h += '<div class="subhead"><span>Sides</span><button class="addbtn" data-act="pick" data-where="side">+ Add side</button></div>';
  if(!d.sides.length) h += '<div class="empty">No sides yet (baked potato, salad, rolls…)</div>';
  d.sides.forEach(function(s){ h += entryHTML(s,'sides'); });

  var sides = sumEntries(d.sides), tot = addM(main, sides);
  function row(lbl, m, cls){ return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+lbl+'</td><td>'+fInt(m.cal)+'</td><td>'+fG(m.p)+'</td><td>'+fG(m.c)+'</td><td>'+fG(m.f)+'</td></tr>'; }
  h += '<table class="breakdown"><tr><th></th><th>CAL</th><th>P</th><th>C</th><th>F</th></tr>'+
    row('Recipe', main)+row('Sides', sides)+row('Dinner total', tot, 'total')+'</table>';
  return h + '</section>';
}

function ideasHTML(d){
  if(!d.dinner && !holdOn(d) && !d.noHold) return '';
  var open = openMeals(d);
  var h = '<section class="card ideas"><div class="card-h"><h2>Meal ideas</h2><span class="tag ghost">From your library</span></div>';
  var t = dayTotals(d);
  var allOn = MAC.every(function(m){ return status(m, t[m]).k==='on'; });
  if(!open.length){
    h += '<p class="hint" style="margin:0">Every meal is planned or skipped. '+(allOn ? 'Your day lands on target ✓' : 'Nudge quantities to close it out. Check the budget at the top.')+'</p>';
    return h + '</section>';
  }
  var mode = S.settings.ideaMode==='meal' ? 'meal' : 'day';
  h += '<div class="modeseg"><button class="'+(mode==='day'?'on':'')+'" data-act="ideaMode" data-mode="day">Whole day</button>'+
    '<button class="'+(mode==='meal'?'on':'')+'" data-act="ideaMode" data-mode="meal">One meal</button></div>';
  if(mode==='day'){
    if(allOn) return h + '<p class="hint" style="margin:6px 0 0">Your day is already on target. Nothing else needed today.</p></section>';
    return h + dayPlanHTML(d, open) + '</section>';
  }

  var meal = (ui.ideaMeal && open.indexOf(ui.ideaMeal)>=0) ? ui.ideaMeal : open[0];
  var label = mealLabel(meal);
  h += '<div class="chips">'+open.map(function(m){ return '<button class="chip'+(m===meal?' on':'')+'" data-act="ideaMeal" data-meal="'+m+'">'+mealLabel(m)+'</button>'; }).join('')+'</div>';

  if(allOn){
    h += '<p class="hint">Your day is already on target. You don’t need '+label.toLowerCase()+' today.</p>';
    h += '<div class="ideas-actions"><button class="btn" data-act="skip" data-meal="'+meal+'">Skip '+esc(label)+' today</button></div>';
    ui.lastIdeas = [];
    return h + '</section>';
  }

  var mt = mealTarget(d, meal);
  h += '<div class="aim">'+(mt.closing?'<b>Last open meal.</b> This closes out your day.<br>':'')+
    '<b>'+esc(label)+':</b> Aim for about <b>'+fInt(mt.t.cal)+' cal</b> · '+fG(Math.round(mt.t.p))+'P · '+fG(Math.round(mt.t.c))+'C · '+fG(Math.round(mt.t.f))+'F</div>';

  var ideas = buildIdeas(meal, mt.t, mt.left);
  if(!ideas.length){
    ui.lastIdeas = [];
    h += '<p class="hint">Nothing in your library fits '+esc(label.toLowerCase())+' right now. Add a few go-to '+esc(label.toLowerCase())+' foods (and some proteins or sides) so I have options to work with.</p>';
    h += '<div class="ideas-actions"><button class="btn primary" data-act="newFor" data-meal="'+meal+'">+ New '+esc(label)+' item</button><button class="btn" data-act="skip" data-meal="'+meal+'">Skip '+esc(label)+'</button></div>';
    return h + '</section>';
  }
  var pages = Math.ceil(ideas.length/3);
  if(ui.ideaPage >= pages) ui.ideaPage = 0;
  var shown = ideas.slice(ui.ideaPage*3, ui.ideaPage*3+3);
  ui.lastIdeas = shown; ui.lastIdeaMeal = meal;
  shown.forEach(function(o,i){
    var name = o.parts.map(function(p){ return '<span class="q">'+fQ(p.q)+'×</span> '+esc(p.it.name); }).join(' + ');
    h += '<div class="idea"'+(i===0?' style="border-top:0"':'')+'><div class="idea-txt"><div class="idea-name">'+name+(o.hit?'<span class="fitbadge">✓ on target</span>':'')+'</div>'+
      '<div class="macline">'+macLine(o.sum)+'</div></div><button class="btn primary sm" data-act="addIdea" data-i="'+i+'">Add</button></div>';
  });
  h += '<div class="ideas-actions">'+(pages>1?'<button class="btn" data-act="moreIdeas">More ideas</button>':'')+
    '<button class="btn" data-act="skip" data-meal="'+meal+'">Skip '+esc(label)+' today</button></div>';
  return h + '</section>';
}

function mealLabel(k){
  var mm = /^snacks(\d+)$/.exec(k); if(mm) return 'Snack '+mm[1];
  for(var i=0;i<MEALS.length;i++) if(MEALS[i].key===k) return MEALS[i].label; return k;
}

function mealHTML(d, m){
  var list = d.meals[m.key] || [], sub = sumEntries(list), skipped = !!d.skipped[m.key];
  var extra = extrasOf(d).indexOf(m.key) >= 0, plan = planKeys(d).indexOf(m.key) >= 0;
  var h = '<section class="card"><div class="card-h"><div><h2>'+esc(m.label)+'</h2>'+
    (list.length ? '<div class="sub">'+macLine(sub)+'</div>' : '')+'</div><div class="row-btns">';
  if(!list.length && extra) h += '<button class="xmini" data-act="removeSnack" data-meal="'+m.key+'" aria-label="Remove this snack slot">&times;</button>';
  if(!skipped) h += '<button class="addbtn" data-act="pick" data-where="'+m.key+'">+ Add</button>';
  h += '</div></div>';
  if(skipped && !list.length){
    h += '<div class="skipbox"><span>'+(m.key==='post'?'No post-workout today':'Skipped today')+'</span><button class="btn sm" data-act="unskip" data-meal="'+m.key+'">Undo</button></div>';
  } else if(!list.length){
    h += '<div class="emptyrow"><span class="empty">'+(m.key==='first'?'Nothing yet':'Not planned yet')+'</span>'+
      (plan && !extra ? '<button class="linkbtn" data-act="skip" data-meal="'+m.key+'">'+(m.key==='post'?'Not today':'Skip today')+'</button>' : '')+'</div>';
  }
  list.forEach(function(e){ h += entryHTML(e, m.key); });
  var lastSnack = extrasOf(d).length ? extrasOf(d)[extrasOf(d).length-1] : 'snacks';
  if(m.key===lastSnack && 1+extrasOf(d).length < MAX_SNACKS) h += '<button class="linkbtn addslot" data-act="addSnack">+ Add another snack</button>';
  return h + '</section>';
}

function renderLibrary(){
  var h = '<div class="pagehead"><h1>Library</h1><button class="btn primary" data-act="newItem">+ New</button></div>'+

    '<div id="libList"></div>';
  document.getElementById('screen-library').innerHTML = h;
  renderLibList();

function filterLib(cat, q){
  q = (q||'').trim().toLowerCase();
  return S.library.filter(function(it){
    if(cat && cat!=='All' && it.cat!==cat) return false;
    if(q && (it.name+' '+(it.serving||'')+' '+it.cat).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function(a,b){ return a.name.localeCompare(b.name); });
}
function renderLibList(){
  var el = document.getElementById('libList'); if(!el) return;
  var list = filterLib(ui.libCat, ui.libSearch);
  var h = '<div class="libcount">'+list.length+' item'+(list.length===1?'':'s')+'</div>';
  if(!list.length){
    h += '<div class="card"><p class="hint" style="margin:0">'+(S.library.length<=1
      ? 'Your library is just getting started. Tap <b>+ New</b> to add your go-to foods, proteins, sides, and dinner recipes.'
      : 'No matches. Try another search or category, or add a new item.')+'</p></div>';
  }
  list.forEach(function(it){
    h += '<button class="libitem" data-act="openItem" data-id="'+esc(it.id)+'"><div class="li-main"><div class="li-name">'+esc(it.name)+'</div>'+
      '<div class="li-sub">'+esc(it.cat)+(it.serving?' · '+esc(it.serving):'')+(it.servings?' · makes '+fG(it.servings):'')+'</div>'+
      '<div class="li-sub">'+fG(it.p)+'P · '+fG(it.c)+'C · '+fG(it.f)+'F</div></div>'+
      '<div class="li-cal">'+fInt(it.cal)+'<small>cal</small></div></button>';
  });
  el.innerHTML = h;
}

  var start = S.settings.start, tk = todayKey(), hits = 0, cells = '';
  var heads = '<div></div>';
  for(var i=0;i<7;i++) heads += '<div class="dh">'+parseKey(addDays(start,i)).toLocaleDateString('en-US',{weekday:'narrow'})+'</div>';
  for(var w=0; w<6; w++){
    cells += '<div class="wk">WK'+(w+1)+'</div>';
    for(var dd=0; dd<7; dd++){
      var k = addDays(start, w*7+dd), cls = 'cell';
      if(k <= tk){ if(dayHit(S.days[k])){ cls += ' hit'; hits++; } else cls += ' miss'; }
      if(k === tk) cls += ' today';
      cells += '<button class="'+cls+'" data-act="gotoDay" data-key="'+k+'" aria-label="'+prettyDate(k)+'">'+parseKey(k).getDate()+'</button>';
    }
  }
  return '<div class="card-h"><h2>Challenge board</h2><span class="tag">6 weeks</span></div>'+
    '<div class="boardcount"><div class="bignum">'+hits+'</div><span>/42 days on target</span></div>'+
    '<p class="hint" style="margin:0 0 10px;color:var(--blockMuted)">A day counts when everything you checked off as eaten lands within your tolerance.</p>'+

/* ================= SHEETS ================= */
var sheet = document.getElementById('sheet'), backdrop = document.getElementById('backdrop');
var sheetHead = document.getElementById('sheetHead'), sheetBody = document.getElementById('sheetBody');
function openSheet(title, html){
  document.getElementById('sheetTitle').textContent = title;
  sheetBody.innerHTML = html;
  sheetBody.scrollTop = 0;
  sheet.style.transform = '';
  sheet.classList.add('open'); backdrop.classList.add('open');
  document.body.classList.add('noscroll');
}
function closeSheet(){
  sheet.style.transition = ''; sheet.style.transform = '';
  sheet.classList.remove('open'); backdrop.classList.remove('open');
  document.body.classList.remove('noscroll');
  ui.sheet = null;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
backdrop.addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && sheet.classList.contains('open')) closeSheet(); });

var drag = null;
sheetHead.addEventListener('pointerdown', function(e){
  if(e.target.closest('button')) return;
  drag = {y:e.clientY, t:Date.now(), dy:0, id:e.pointerId};
  sheet.style.transition = 'none';
  try { sheetHead.setPointerCapture(e.pointerId); } catch(_){}
});
sheetHead.addEventListener('pointermove', function(e){
  if(!drag) return;
  drag.dy = Math.max(0, e.clientY - drag.y);
  sheet.style.transform = 'translateY('+drag.dy+'px)';
});
function endDrag(){
  if(!drag) return;
  var dy = drag.dy, v = dy / Math.max(1, Date.now()-drag.t);
  drag = null; sheet.style.transition = '';
  if(dy > 90 || (v > 0.5 && dy > 30)) closeSheet(); else sheet.style.transform = '';
}
sheetHead.addEventListener('pointerup', endDrag);
sheetHead.addEventListener('pointercancel', endDrag);

function whereLabel(w){ return w==='dinner'?'Dinner (main)': w==='side'?'Dinner side': mealLabel(w); }
function openPicker(where){
  var def = where==='dinner' ? 'Dinners' : where==='side' ? 'Sides & Extras' : 'All';
  ui.sheet = {type:'picker', where:where, cat:def, q:''};
  var title = where==='dinner' ? 'Pick dinner recipe' : where==='side' ? 'Add a dinner side' : 'Add to '+mealLabel(where);
  var h = '<input id="pickSearch" class="search" type="search" placeholder="Search your library" autocomplete="off">'+
    '<div class="chips" id="pickChips" style="margin-top:10px"></div><div id="pickList"></div>'+
    '<button class="btn outline wide" style="margin-top:12px" data-act="newFrom">+ New item</button>';
  openSheet(title, h);
  renderPicker();
}
function renderPicker(){
  var p = ui.sheet; if(!p || p.type!=='picker') return;
  document.getElementById('pickChips').innerHTML = ['All'].concat(CATS).map(function(c){
    return '<button class="chip'+(p.cat===c?' on':'')+'" data-act="pickCat" data-cat="'+esc(c)+'">'+esc(c)+'</button>'; }).join('');
  var list = filterLib(p.cat, p.q);
  var aff = affOf(p.where);
  if(p.cat==='All' && aff.length) list.sort(function(a,b){ return (aff.indexOf(a.cat)<0) - (aff.indexOf(b.cat)<0) || a.name.localeCompare(b.name); });
  var h = '';
  if(!list.length) h += '<p class="hint">'+(p.cat!=='All' ? 'Nothing in '+esc(p.cat)+' yet. <button class="btn sm" data-act="pickCat" data-cat="All">Show all</button>' : 'No matches.')+'</p>';
  list.forEach(function(it){
    h += '<button class="pick" data-act="pickItem" data-id="'+esc(it.id)+'"><div class="li-main"><div class="li-name">'+esc(it.name)+'</div>'+
      '<div class="li-sub">'+esc(it.serving||it.cat)+'</div><div class="li-sub">'+macLine(it)+'</div></div><span class="plus">+</span></button>';
  });
  document.getElementById('pickList').innerHTML = h;
}

function openItemSheet(id, opts){
  opts = opts || {};
  var it = id ? getItem(id) : null;
  if(id && !it) return;
  ui.sheet = {type:'item', id:id, thenAdd:opts.thenAdd||null};
  var v = it || {name:'', serving:'', cat:opts.cat||'Snacks', cal:'', p:'', c:'', f:'', servings:''};
  var h = '';
  if(it){
    h += '<h3 style="margin-bottom:10px">Add to '+esc(dayShort(ui.dayKey))+'</h3><div class="addgrid">'+
      mealsOf(ensureDay(ui.dayKey)).map(function(m){ return '<button class="btn primary" data-act="addTo" data-where="'+m.key+'">'+esc(m.label)+'</button>'; }).join('')+
      '<button class="btn dinner" data-act="addTo" data-where="dinner">Dinner (main)</button>'+
      '<button class="btn dinner" data-act="addTo" data-where="side">Dinner side</button></div>'+
      '<div class="divider"></div><h3 style="margin-bottom:10px">Edit item</h3>';
  }
  h += '<div class="field"><label>Name</label><input id="f_name" type="text" value="'+esc(v.name)+'" placeholder="e.g. Chicken burrito bowl"></div>'+
    '<div class="field"><label>Serving description</label><input id="f_serving" type="text" value="'+esc(v.serving||'')+'" placeholder="e.g. 1 cup, 4 oz, 1 bowl"></div>'+
    '<div class="field"><label>Category</label><select id="f_cat">'+CATS.map(function(c){ return '<option'+(c===v.cat?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select></div>'+
    '<div class="grid4">'+
    '<div class="field"><label>Calories</label><input id="f_cal" class="mf" type="number" inputmode="decimal" step="any" placeholder="auto" value="'+(it && !it.calAuto ? esc(v.cal) : '')+'"></div>'+
    '<div class="field"><label>Protein (g)</label><input id="f_p" class="mf" type="number" inputmode="decimal" step="any" value="'+esc(v.p)+'"></div>'+
    '<div class="field"><label>Carbs (g)</label><input id="f_c" class="mf" type="number" inputmode="decimal" step="any" value="'+esc(v.c)+'"></div>'+
    '<div class="field"><label>Fat (g)</label><input id="f_f" class="mf" type="number" inputmode="decimal" step="any" value="'+esc(v.f)+'"></div></div>'+
    '<div class="calc" id="calcHint"></div>'+
    '<div class="field"><label>Recipe makes X servings (optional)</label><input id="f_serv" type="number" inputmode="decimal" step="any" value="'+esc(v.servings||'')+'" placeholder="e.g. 6"></div>'+
    '<p class="hint" style="margin-top:-4px">Macros are per 1 serving. Leave calories blank to calculate P×4 + C×4 + F×9.</p>'+
    '<button class="btn primary wide" style="margin-top:14px" data-act="saveItem">'+(it?'Save changes':(opts.thenAdd?'Save &amp; add to '+esc(whereLabel(opts.thenAdd)):'Save item'))+'</button>'+
    (it ? '<button class="btn danger wide" style="margin-top:10px" data-act="deleteItem">Delete item</button>' : '');
  openSheet(it ? it.name : 'New item', h);
  updateCalcHint();
}
function updateCalcHint(){
  var el = document.getElementById('calcHint'); if(!el) return;
  var cal = num(document.getElementById('f_cal').value);
  var p = num(document.getElementById('f_p').value)||0, c = num(document.getElementById('f_c').value)||0, f = num(document.getElementById('f_f').value)||0;
  var a = autoCal(p,c,f);
  el.textContent = cal===null ? 'Calories will be '+fG(a)+' (auto)' : (Math.abs(cal-a) > Math.max(25, a*0.15) ? 'Heads up: P/C/F add up to about '+fInt(a)+' cal' : '');
}
function saveItem(){
  var s = ui.sheet; if(!s || s.type!=='item') return;
  var name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Give it a name'); document.getElementById('f_name').focus(); return; }
  var p = r1(num(document.getElementById('f_p').value)||0), c = r1(num(document.getElementById('f_c').value)||0), f = r1(num(document.getElementById('f_f').value)||0);
  var calIn = num(document.getElementById('f_cal').value);
  var serv = num(document.getElementById('f_serv').value);
  var data = { name:name, serving:document.getElementById('f_serving').value.trim(), cat:document.getElementById('f_cat').value,
    p:p, c:c, f:f, cal: calIn===null ? autoCal(p,c,f) : r1(calIn), calAuto: calIn===null, servings: serv && serv>0 ? r2(serv) : null };
  var it;
  if(s.id){
    it = getItem(s.id); Object.assign(it, data);
    var tk = todayKey();
    Object.keys(S.days).forEach(function(k){
      if(k < tk) return;
      allEntries(S.days[k]).forEach(function(e){
        if(e.itemId===it.id){ e.name=it.name; e.serving=it.serving; e.cat=it.cat; e.cal=it.cal; e.p=it.p; e.c=it.c; e.f=it.f; e.servings=it.servings; }
      });
    });
    save(); closeSheet(); render(); toast('Saved');
  } else {
    it = Object.assign({id:uid()}, data);
    S.library.push(it); save();
    var then = s.thenAdd; closeSheet();
    if(then) addToDay(then, it); else { render(); toast('Added to library'); }
  }
}

/* ================= ACTIONS ================= */
function addToDay(where, it, qty){
  var d = ensureDay(ui.dayKey), e = makeEntry(it, qty||1);
  if(where==='dinner') d.dinner = e;
  else if(where==='side') d.sides.push(e);
  else { d.meals[where].push(e); d.skipped[where] = false; }
  ui.ideaPage = 0;
  save(); render();
  toast(it.name+' → '+whereLabel(where)+(ui.dayKey===todayKey()?'':' ('+dayShort(ui.dayKey)+')'));
}
function listFor(d, where){ return where==='sides' ? d.sides : d.meals[where]; }
function findEntry(d, where, id){
  if(where==='dinner') return d.dinner && d.dinner.uid===id ? d.dinner : null;
  var l = listFor(d, where); for(var i=0;i<l.length;i++) if(l[i].uid===id) return l[i];
  return null;
}

var handlers = {
  tab: function(b){ ui.tab = b.dataset.tab; render(); window.scrollTo(0,0); },
  prevDay: function(){ ui.dayKey = addDays(ui.dayKey,-1); ui.ideaMeal=null; ui.ideaPage=0; render(); },
  nextDay: function(){ ui.dayKey = addDays(ui.dayKey,1); ui.ideaMeal=null; ui.ideaPage=0; render(); },
  goToday: function(){ ui.dayKey = todayKey(); ui.ideaMeal=null; ui.ideaPage=0; render(); },
  gotoDay: function(b){ ui.dayKey = b.dataset.key; ui.tab='today'; ui.ideaMeal=null; ui.ideaPage=0; render(); window.scrollTo(0,0); },
  pick: function(b){ openPicker(b.dataset.where); },
  pickCat: function(b){ ui.sheet.cat = b.dataset.cat; renderPicker(); },
  pickItem: function(b){ var it=getItem(b.dataset.id), w=ui.sheet.where; closeSheet(); if(it) addToDay(w, it); },
  newFrom: function(){
    var w = ui.sheet.where;
    var cat = w==='dinner'?'Dinners': w==='side'?'Sides & Extras': w==='breakfast'?'Breakfast': w==='lunch'?'Lunch': isSnack(w)?'Snacks': 'Shakes & Coffee';
    openItemSheet(null, {cat:cat, thenAdd:w});
  },
  newFor: function(b){ var m=b.dataset.meal; openItemSheet(null, {cat:m==='breakfast'?'Breakfast':m==='lunch'?'Lunch':isSnack(m)?'Snacks':'Shakes & Coffee', thenAdd:m}); },
  addSnack: function(){
    var d = ensureDay(ui.dayKey), n = 2; d.extraSnacks = extrasOf(d);
    while(d.extraSnacks.indexOf('snacks'+n) >= 0) n++;
    if(1 + d.extraSnacks.length >= MAX_SNACKS) return;
    var k = 'snacks'+n; d.extraSnacks.push(k); d.meals[k] = [];
    ui.ideaPage = 0; save(); render(); toast(mealLabel(k)+' added');
  },
  removeSnack: function(b){
    var d = ensureDay(ui.dayKey), k = b.dataset.meal;
    if((d.meals[k]||[]).length) return;
    d.extraSnacks = extrasOf(d).filter(function(x){ return x!==k; });
    delete d.meals[k]; delete d.skipped[k];
    if(d.plan && d.plan.picks) delete d.plan.picks[k];
    ui.ideaPage = 0; save(); render();
  },
  inc: function(b){ step(b, 0.25); },
  dec: function(b){ step(b, -0.25); },
  eat: function(b){ var d=ensureDay(ui.dayKey), e=findEntry(d,b.dataset.where,b.dataset.uid); if(e){ e.eaten=!e.eaten; save(); render(); } },
  remove: function(b){
    var d = ensureDay(ui.dayKey), w = b.dataset.where;
    if(w==='dinner') d.dinner = null;
    else { var l = listFor(d,w), i = l.findIndex(function(e){ return e.uid===b.dataset.uid; }); if(i>=0) l.splice(i,1); }
    ui.ideaPage = 0; save(); render();
  },
  fastToggle: function(){
    if(S.fast.on){ var mins = Math.round((Date.now()-S.fast.start)/60000); S.fast = {on:false, start:null, hours:S.fast.hours}; save(); render(); toast('Fast ended · '+hm(mins*60000)); }
    else { S.fast = {on:true, start:Date.now(), hours:S.settings.fastHours||16, notified:false}; save(); render(); toast(S.fast.hours+'h fast started'); }
  },
  fastHours: function(b){ var h = +b.dataset.h; if(S.fast.on){ S.fast.hours = h; S.fast.notified = false; } S.settings.fastHours = h; save(); render(); },
  holdToggle: function(){ var d=ensureDay(ui.dayKey); d.noHold = !d.noHold; ui.ideaPage=0; save(); render(); },
  useSuggest: function(b){ var d=ensureDay(ui.dayKey); if(d.dinner){ d.dinner.qty = r2(+b.dataset.q); save(); render(); toast('Dinner set to '+fQ(d.dinner.qty)+' servings'); } },
  ideaMode: function(b){ S.settings.ideaMode = b.dataset.mode; save(); render(); },
  planMix: function(b){ var d=ensureDay(ui.dayKey); if(mixMeal(d, b.dataset.meal)){ save(); render(); } },
  planMixAll: function(){
    var d = ensureDay(ui.dayKey), p = ensurePlan(d), open = openMeals(d);
    var cur = planKey(p.picks, open); if(p.seenPlans.indexOf(cur) < 0) p.seenPlans.push(cur);
    var r = genPlan(d, p.seenPlans);
    if(p.seenPlans.indexOf(r.key) >= 0){ p.seenPlans = [cur]; r = genPlan(d, p.seenPlans); }
    if(r.key === cur){ toast('That’s the only combo that fits. Add more foods for variety.'); return; }
    p.picks = r.picks; p.seen = {}; p.seenPlans.push(r.key);
    save(); render();
  },
  planAdd: function(b){ var d=ensureDay(ui.dayKey), m=b.dataset.meal; if(addPlanMeal(d,m)){ save(); render(); toast('Added to '+mealLabel(m)); } },
  planAddAll: function(){
    var d = ensureDay(ui.dayKey), n = 0;
    openMeals(d).forEach(function(m){ if(addPlanMeal(d, m)) n++; });
    if(n){ save(); render(); toast('Day planned ✓'); }
  },
  ideaMeal: function(b){ ui.ideaMeal = b.dataset.meal; ui.ideaPage = 0; render(); },
  moreIdeas: function(){ ui.ideaPage++; render(); },
  addIdea: function(b){
    var o = ui.lastIdeas[+b.dataset.i], meal = ui.lastIdeaMeal; if(!o) return;
    var d = ensureDay(ui.dayKey);
    o.parts.forEach(function(p){ d.meals[meal].push(makeEntry(p.it, p.q)); });
    d.skipped[meal] = false; ui.ideaMeal = null; ui.ideaPage = 0;
    save(); render(); toast('Added to '+mealLabel(meal));
  },
  skip: function(b){ var d=ensureDay(ui.dayKey); d.skipped[b.dataset.meal]=true; ui.ideaMeal=null; ui.ideaPage=0; save(); render(); toast(mealLabel(b.dataset.meal)+' skipped'); },
  unskip: function(b){ var d=ensureDay(ui.dayKey); d.skipped[b.dataset.meal]=false; save(); render(); },
  newItem: function(){ openItemSheet(null, {cat: ui.libCat!=='All' ? ui.libCat : 'Snacks'}); },
  openItem: function(b){ openItemSheet(b.dataset.id); },
  libCat: function(b){ ui.libCat = b.dataset.cat; renderLibrary(); },
  addTo: function(b){ var it=getItem(ui.sheet.id), w=b.dataset.where; closeSheet(); if(it) addToDay(w, it); },
  saveItem: saveItem,
  deleteItem: function(){
    var it = getItem(ui.sheet.id); if(!it) return;
    var msg = 'Delete "'+it.name+'" from your library? Days you already planned keep their entries.' + (it.id==='coffee' ? ' Your protein coffee will stop being added automatically.' : '');
    if(!confirm(msg)) return;
    S.library = S.library.filter(function(x){ return x.id!==it.id; });
    save(); closeSheet(); render(); toast('Deleted');
  },
  closeSheet: closeSheet,
  postDefault: function(b){ S.settings.postDefault = b.dataset.v==='1'; save(); renderTargets(); toast('Saved'); },
  theme: function(b){ S.settings.theme = b.dataset.theme; save(); applyTheme(); renderTargets(); },
  backup: function(){
    var txt = JSON.stringify({app:'macro-planner', version:APP_VERSION, exported:new Date().toISOString(), data:S});
    var ta = document.getElementById('backupText'); ta.value = txt;
    copyText(txt, ta);
  },
  restore: function(){
    var raw = document.getElementById('restoreText').value.trim();
    if(!raw){ toast('Paste your backup text first'); return; }
    var obj;
    try { obj = JSON.parse(raw); } catch(e){ alert('That text isn’t a valid backup. Make sure you pasted the whole thing.'); return; }
    var data = obj && obj.data ? obj.data : obj;
    if(!data || !Array.isArray(data.library) || typeof data.days!=='object'){ alert('That doesn’t look like a Macro Planner backup.'); return; }
    if(!confirm('Replace ALL data on this device with this backup? ('+data.library.length+' library items, '+Object.keys(data.days).length+' days)')) return;
    S = normalize(data); save(); ui.dayKey = todayKey(); render(); toast('Restored ✓');
  }
};
function step(b, delta){
  var d = ensureDay(ui.dayKey), e = findEntry(d, b.dataset.where, b.dataset.uid); if(!e) return;
  e.qty = Math.max(0.25, r2(e.qty + delta));
  save(); render();
}
function copyText(txt, ta){
  function fallback(){
    try { ta.removeAttribute('readonly'); ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length); var ok=document.execCommand('copy'); ta.setAttribute('readonly',''); toast(ok?'Backup copied ✓':'Select the text below and copy it'); }
    catch(e){ toast('Select the text below and copy it'); }
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){ toast('Backup copied ✓ Paste it somewhere safe'); }, fallback);
  } else fallback();
}

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  var fn = handlers[b.dataset.act]; if(fn){ e.preventDefault(); fn(b); }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id==='libSearch'){ ui.libSearch = t.value; renderLibList(); }
  else if(t.id==='pickSearch' && ui.sheet){ ui.sheet.q = t.value; renderPicker(); }
  else if(t.classList && t.classList.contains('mf')) updateCalcHint();
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id==='fastCustom'){
    var hv = num(t.value); if(hv===null || hv<1 || hv>72){ toast('Enter 1 to 72 hours'); return; }
    hv = r1(hv); if(S.fast.on){ S.fast.hours = hv; S.fast.notified = false; } S.settings.fastHours = hv; save(); render(); return;
  }
  if(t.id==='fastStartTime' && S.fast.on && t.value){
    var hmv = t.value.split(':'), d0 = new Date(); d0.setHours(+hmv[0], +hmv[1], 0, 0);
    if(d0.getTime() > Date.now()) d0.setDate(d0.getDate()-1);
    S.fast.start = d0.getTime(); S.fast.notified = false; save(); render(); toast('Start time updated'); return;
  }
  var path = t.dataset && t.dataset.path; if(!path) return;
  var v = num(t.value);
  if(v===null || v<0){ toast('Enter a number'); renderTargets(); return; }
  var parts = path.split('.');
  if(parts.length===2) S.settings[parts[0]][parts[1]] = r1(v);
  else S.settings[parts[0]] = path==='snackSlots' ? Math.max(1, Math.min(MAX_SNACKS, Math.round(v))) : r1(v);
  save();
  var bw = document.getElementById('boardWrap'); if(bw) bw.innerHTML = boardHTML();
  toast('Saved');
});

document.addEventListener('visibilitychange', function(){
  if(document.visibilityState!=='visible') return;
  tickFast();
  var tk = todayKey();
  if(tk !== ui.lastToday){ if(ui.dayKey===ui.lastToday) ui.dayKey = tk; ui.lastToday = tk; render(); }
});

render();
})();
</script>
